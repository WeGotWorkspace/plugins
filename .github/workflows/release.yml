name: Release plugin

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Plugin folder id (e.g. onlyoffice)
        required: true
        default: onlyoffice
      version:
        description: Semver without v prefix (uses plugin VERSION file when empty)
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Require signed annotated tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"

          TYPE="$(git cat-file -t "$TAG")"
          if [[ "$TYPE" != "tag" ]]; then
            echo "::error::${TAG} is not an annotated tag."
            echo "::error::Create and push a signed annotated tag from local git."
            exit 1
          fi
          git cat-file -p "$TAG" > /tmp/tag-object.txt
          if ! grep -Eq 'BEGIN (PGP|SSH) SIGNATURE' /tmp/tag-object.txt; then
            echo "::error::${TAG} is not signed."
            exit 1
          fi

      - name: Resolve plugin id and version
        id: release
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Tag must match <plugin-id>-v<semver>, got ${TAG}"
              exit 1
            fi
            echo "plugin_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            PLUGIN="${{ github.event.inputs.plugin_id }}"
            VERSION="${{ github.event.inputs.version }}"
            if [[ -z "$VERSION" ]]; then
              VERSION="$(tr -d '[:space:]' < "${PLUGIN}/VERSION" | sed 's/^v//')"
            fi
            echo "plugin_id=${PLUGIN}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${PLUGIN}-v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build release assets
        env:
          PLUGIN_ID: ${{ steps.release.outputs.plugin_id }}
          WGW_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          WGW_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.WGW_RELEASE_SIGNING_PRIVATE_KEY }}
        run: node tools/build-plugin-release.mjs "${{ steps.release.outputs.plugin_id }}"

      - name: Upload GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/releases/wgw-plugin-${{ steps.release.outputs.plugin_id }}-${{ steps.release.outputs.version }}.zip
            dist/releases/wgw-plugin-${{ steps.release.outputs.plugin_id }}-manifest.json
            dist/releases/wgw-plugin-${{ steps.release.outputs.plugin_id }}-manifest.sig

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wgw-plugin-${{ steps.release.outputs.plugin_id }}-${{ steps.release.outputs.version }}
          path: dist/releases/wgw-plugin-${{ steps.release.outputs.plugin_id }}-*
